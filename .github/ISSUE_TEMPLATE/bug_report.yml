name: Bug report
description: Something in Grove or GroveKit doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grove version
      description: Grove › About Grove, or the GroveKit tag you depend on.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: git version
      description: Output of `git --version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private (remote URLs, paths, tokens) first.
