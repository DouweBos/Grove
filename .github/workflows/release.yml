name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 (betas get -beta.N appended)"
        required: true
      channel:
        description: "Release channel"
        type: choice
        options:
          - production
          - beta
        default: beta
      notes:
        description: "Release notes, one change per line (defaults to commit subjects since the last tag)"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        run: |
          BASE="${{ inputs.version }}"
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be x.y.z"; exit 1; }
          if [ "$CHANNEL" = "production" ]; then
            VERSION="$BASE"
          else
            HIGHEST=$(git tag -l "v${BASE}-beta.*" | sed -n "s/^v${BASE}-beta\.\([0-9]*\)$/\1/p" | sort -n | tail -1)
            VERSION="${BASE}-beta.$(( ${HIGHEST:-0} + 1 ))"
          fi
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null && { echo "v${VERSION} already exists"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION ($CHANNEL)"

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "No Xcode 27 on this runner"; ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create build keychain
        env:
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain

      - name: Encode match git auth
        env:
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          AUTH=$(printf '%s' "x-access-token:${MATCH_GIT_PAT}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: Build, notarize and package
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GROVE_RELEASE_NOTES: ${{ inputs.notes }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          bundle exec fastlane mac release \
            version:${{ steps.version.outputs.version }} \
            channel:$CHANNEL \
            build:$(git rev-list --count HEAD)

      - name: Publish GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          FLAGS=()
          [ "$CHANNEL" = "beta" ] && FLAGS+=(--prerelease)
          # The html notes are what Sparkle shows; the release page gets the same list.
          sed 's|<li>|- |; s|</li>||; /<\/*ul>/d' "dist/appcast/Grove-${VERSION}.html" > notes.md
          gh release create "v${VERSION}" "${FLAGS[@]}" --title "Grove ${VERSION}" --notes-file notes.md \
            "dist/appcast/Grove-${VERSION}.zip" \
            "dist/appcast/appcast.xml" \
            "dist/Grove-${VERSION}.dmg"
